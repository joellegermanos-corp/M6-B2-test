name: M6-feedback-loop

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "services/**"
      - "tests/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "services/**"
      - "tests/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    #- cron: '0 */6 * * *'
    - cron: '*/5 * * * *'

jobs:
  run-tests:
    name: Run feedback and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run loop tests
        run: |
          pytest -q tests/test_boucle.py

      - name: Run API tests
        run: |
          pytest -q services/model/tests/test_api.py

  build-image:
    needs: run-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build model image
        run: docker build -f services/model/Dockerfile -t pyrenex-model:${{ github.sha }} .

  retrain:
    needs: run-tests
    # Pour déclencher aussi le retrain sur push, remplacer la ligne suivante par :
    # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Display trigger
        run: |
          echo "Event: ${{ github.event_name }}"

      - name: Trigger retraining if threshold is reached
        run: |
          python scripts/retrain.py --min-feedback 2
      
